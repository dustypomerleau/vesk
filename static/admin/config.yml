# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: dustypomerleau/vesk
  branch: staging
  client_id: Ov23liPkvrojGOXMLin2
  # failed redirect on staging site is to:
  # https://github.com/login/oauth/authorize?client_id=Ov23liPkvrojGOXMLin2/auth?provider=github&site_id=staging--viceye.netlify.app&scope=repo%2Cuser
  # deleting the query string fixes it
  # aha the issue is that there is already a query string in your base URL so you have 2 ? so maybe we need a separate yaml key for the client_id
media_folder: /static/media
public_folder: /media
media_libraries:
  cloudinary:
    config:
      cloud_name: vesk
      api_key: "183891283152378"
collections:
  - name: blog
    icon: post
    label: Blog Posts
    label_singular: Post
    folder: /src/routes/blog
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Brief title (page header), name: brief, widget: string}
      - {label: Date, name: date, widget: datetime, type: date}
      - {label: Body, name: body, widget: richtext}
